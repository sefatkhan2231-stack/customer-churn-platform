<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ChurnGuard logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1fa8"/>
      <stop offset="1" stop-color="#6a4cff"/>
